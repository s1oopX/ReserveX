brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
# 单 broker 没有副本；同步刷盘只收窄本地 broker 崩溃时的确认窗口，不等于高可用复制。
flushDiskType = SYNC_FLUSH
autoCreateTopicEnable = false
# RocketMQ 5.5 的 broker 请求管线使用 auth 模块；旧 aclEnable 在该版本不会
# 实际安装认证/授权管线。plain_acl.yml 仅作为启动迁移源。
authenticationEnabled = true
authenticationMetadataProvider = org.apache.rocketmq.auth.authentication.provider.LocalAuthenticationMetadataProvider
authorizationEnabled = true
authorizationMetadataProvider = org.apache.rocketmq.auth.authorization.provider.LocalAuthorizationMetadataProvider
migrateAuthFromV1Enabled = true

# §6.4「MQ 积压超阈值告警」的数据源。5.5.0 自带 Prometheus 导出,不需要额外
# exporter 进程;rocketmq_consumer_lag_messages 就来自这里。
metricsExporterType = PROM
metricsPromExporterPort = 5557
# ⚠️ 留空不等于 0.0.0.0:BrokerMetricsManager 在 host 为空时回落到
#    brokerConfig.getBrokerIP1()(自动探测到的容器 IP),跨容器抓取就要赌那个值
#    正好可达 —— broker-entrypoint.sh 并不设置 brokerIP1。显式绑 0.0.0.0。
#    安全上可接受:broker 只在 internal 的 data 网内,没有宿主端口映射。
metricsPromExporterHost = 0.0.0.0
