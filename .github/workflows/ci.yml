name: CI

# 只跑不需要外部服务的检查。后端 221 个测试全是 Mockito 单测与读 classpath 的契约测试,
# 不连 MySQL/Redis/RocketMQ —— 所以 CI 里能诚实地全绿,而不是靠跳过测试凑一个绿徽章。
#
# 需要真实中间件的验证(Lua 冒烟、跨库一致性、可观测链路)留在本地 Docker 全栈做,
# 见 README「工程验证」一节。把它们搬进 CI 需要起 5 个服务,收益不抵维护成本。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一分支的新推送取消仍在跑的旧任务,不排队浪费额度
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Java 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Test
        working-directory: backend
        # -B 关掉进度条噪音;不加 -DskipTests 之类的偷懒开关
        run: mvn -B test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend · Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci 而不是 npm install:严格按 package-lock 装,
      # 否则同一个 commit 在不同日期可能装出不同版本
      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只验插值与语法,不起容器。用假密钥填满 .env ——
      # 这一步能挡住「加了新变量但没写进 .env.example」这类改动。
      - name: Validate docker-compose interpolation
        run: |
          cp .env.example .env
          while read -r line; do
            case "$line" in
              *=) printf '%sci-placeholder-value\n' "$line" >> .env.filled ;;
              *) printf '%s\n' "$line" >> .env.filled ;;
            esac
          done < .env
          mv .env.filled .env
          if grep -qE '^[A-Z_0-9]+=$' .env; then
            echo "still-empty variables:"; grep -nE '^[A-Z_0-9]+=$' .env; exit 1
          fi
          docker compose config --quiet
          echo "compose interpolation OK"
