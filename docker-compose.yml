# ReserveX 一键起全栈(08 §四)
# 演示:docker compose up --build   →  http://localhost:8080
# 新库由 initdb 初始化；已有卷由 mysql-migrate 在 backend 启动前执行幂等迁移。
# 注:不写 version: —— Compose v2+ 已废弃该字段,保留会输出 obsolete 警告。

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped                 # §4.3:不配则容器崩了永久不起
    # §7.2:容器默认 UTC,与 JVM 的 +08:00 差 8h → valid_until / dup TTL 全错
    command:
      - "--default-time-zone=+08:00"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: reservex_single
      MYSQL_USER: reservex_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      TZ: Asia/Shanghai
    expose: ["3306"]
    networks: [data]
    volumes:
      # 按文件名字典序执行:先建库建表,再灌种子(§4.1)
      - ./docker/mysql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      # 分库表 DDL 只有一份,由 01-schema.sql 用 SOURCE 引两次(ds0/ds1)。
      # ⚠️ 必须挂在 initdb.d 之外:放进去会被 entrypoint 当独立脚本执行(没有 USE,建到错的库)
      - ./docker/mysql/sharded-tables.sql:/opt/reservex/sharded-tables.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # §7.3:桶余量/occupy/dup/slot:full/pending 是**库存真理源**,不是缓存
    #   noeviction 是硬约束:配成 allkeys-* 会让库存被静默逐出,且没有任何报错
    #   库存写必须在 Redis 回复前 fsync；否则 MQ 已落盘而 occupy/扣库存仍可能丢失
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "always"
      - "--maxmemory"
      - "1gb"
      - "--maxmemory-policy"
      - "noeviction"
      - "--save"
      - "900 1"
    expose: ["6379"]                        # 只在容器网内可见,库存真理源不裸奔在宿主 6379
    networks: [data]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rmqnamesrv:
    image: reservex-rocketmq:5.5.0-secured
    build: ./docker/rocketmq
    restart: unless-stopped
    command: sh mqnamesrv
    expose: ["9876"]
    networks: [data]
    environment:
      TZ: Asia/Shanghai
      # NameServer 只保存路由元数据，单节点无需默认 1GiB 堆。
      JAVA_OPT_EXT: "${ROCKETMQ_NAMESRV_HEAP_OPTS:--Xms256m -Xmx256m -Xmn128m}"

  rmqbroker:
    image: reservex-rocketmq:5.5.0-secured
    build: ./docker/rocketmq
    user: root
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on: [rmqnamesrv]
    command: sh /init/broker-entrypoint.sh
    # 5557 是 broker.conf 里 metricsPromExporterPort 的值,给 prometheus 抓。
    expose: ["10909", "10911", "5557"]
    networks: [data]
    volumes:
      - ./docker/rocketmq/broker-entrypoint.sh:/init/broker-entrypoint.sh:ro
      - ./docker/rocketmq/broker.conf:/init/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    environment:
      TZ: Asia/Shanghai
      # 单 broker 开发/验收默认 512MiB；生产按吞吐与堆外内存显式上调。
      HEAP_OPTS: "${ROCKETMQ_HEAP_OPTS:--Xms512m -Xmx512m -Xmn256m -XX:MaxDirectMemorySize=512m}"
      ROCKETMQ_APP_SECRET_KEY: ${ROCKETMQ_APP_SECRET_KEY}
      ROCKETMQ_ADMIN_SECRET_KEY: ${ROCKETMQ_ADMIN_SECRET_KEY}

  # §4.4:一次性建 3 个业务 topic + 3 个 DLQ topic。
  #   会把 persistence 的 20 个消费线程卡死在队列数上(现象:线程调大了延迟没降)
  rmq-init:
    image: reservex-rocketmq:5.5.0-secured
    build: ./docker/rocketmq
    depends_on: [rmqbroker]
    restart: "no"                           # 跑完就该退出;配 unless-stopped 会无限重启并刷满日志
    entrypoint: ["/bin/sh", "/init/topics.sh"]
    volumes: ["./docker/rocketmq/topics.sh:/init/topics.sh:ro"]
    networks: [data]
    environment:
      ROCKETMQ_ADMIN_SECRET_KEY: ${ROCKETMQ_ADMIN_SECRET_KEY}

  # Existing MySQL volumes do not run docker-entrypoint-initdb.d again. Apply
  # each immutable migration once before the application starts.
  mysql-migrate:
    image: mysql:8.0
    restart: "no"
    depends_on:
      mysql: { condition: service_healthy }
    command:
      - sh
      - -c
      - >-
        set -eu;
        mysql --protocol=TCP -hmysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" -e "CREATE TABLE IF NOT EXISTS reservex_single.schema_migration (version VARCHAR(255) NOT NULL PRIMARY KEY, checksum CHAR(64) NULL, applied_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP)";
        checksum_column=$$(mysql --protocol=TCP -hmysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" -Nse "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='reservex_single' AND table_name='schema_migration' AND column_name='checksum'");
        if [ "$${checksum_column}" = "0" ]; then
          mysql --protocol=TCP -hmysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" -e "ALTER TABLE reservex_single.schema_migration ADD COLUMN checksum CHAR(64) NULL AFTER version";
        fi;
        for migration in /migrations/*.sql; do
          version=$$(basename "$${migration}");
          checksum=$$(sha256sum "$${migration}" | cut -d ' ' -f 1);
          applied=$$(mysql --protocol=TCP -hmysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" -Nse "SELECT 1 FROM reservex_single.schema_migration WHERE version='$${version}' LIMIT 1");
          if [ "$${applied}" = "1" ]; then
            stored=$$(mysql --protocol=TCP -hmysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" -Nse "SELECT COALESCE(checksum, '') FROM reservex_single.schema_migration WHERE version='$${version}'");
            if [ -z "$${stored}" ]; then
              mysql --protocol=TCP -hmysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" -e "UPDATE reservex_single.schema_migration SET checksum='$${checksum}' WHERE version='$${version}' AND checksum IS NULL";
            elif [ "$${stored}" != "$${checksum}" ]; then
              echo "Migration checksum mismatch: $${version}" >&2;
              exit 1;
            fi;
            echo "Skipping $${version}";
            continue;
          fi;
          echo "Applying $${version}";
          mysql --protocol=TCP -hmysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" < "$${migration}";
          mysql --protocol=TCP -hmysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" -e "INSERT INTO reservex_single.schema_migration(version, checksum) VALUES ('$${version}', '$${checksum}')";
        done;
        mysql --protocol=TCP -hmysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" -e "ALTER TABLE reservex_single.schema_migration MODIFY checksum CHAR(64) NOT NULL"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./docker/mysql/migrations:/migrations:ro
      - ./docker/mysql/sharded-tables.sql:/opt/reservex/sharded-tables.sql:ro
    networks: [data]

  # §4.5:前端产物注入命名卷。没有这个服务,Caddy 托管的是空目录 → 首页 404 而接口全正常
  frontend-build:
    build: ./frontend
    restart: "no"
    # 先删再拷:cp -r 只覆盖同名文件,改名后的旧 hash 资源会永久残留在卷里
    command: ["sh", "-c", "rm -rf /srv/frontend/* && cp -r /app/dist/. /srv/frontend/"]
    volumes: ["frontend-dist:/srv/frontend"]
    networks: []

  backend:
    build: ./backend
    restart: unless-stopped                 # §7.4 的 ExitOnOutOfMemoryError 依赖它才成立
    depends_on:
      mysql: { condition: service_healthy }
      mysql-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rmqbroker: { condition: service_started }
      rmq-init: { condition: service_completed_successfully }   # topic 先建好再起应用
    # ⚠️ 不对宿主暴露 8080:Caddy 已占 8080 反代 /api。
    #    直接暴露会让绕过 Caddy 的 /actuator/* 屏蔽规则成为可能(08 §五 红线 #35)。
    #    调试需要时用 docker compose exec 或临时加映射。
    expose: ["8080"]
    networks: [edge, data]
    volumes:
      # 结构化日志(ECS JSON)落这里,alloy 以只读方式采走(§6.0 Logging)。
      # ⚠️ /app/logs 在 backend/Dockerfile 里已建好并 chown 给 app —— 空卷挂在
      #    镜像中不存在的路径上会是 root:root 755,应用以 app 跑就写不进去。
      - backend-logs:/app/logs
    # §7.4:必须 > spring.lifecycle.timeout-per-shutdown-phase(30s)。
    #   默认 10s 会在 D6 消费者卡在阶段1↔阶段2(跨库无事务保护)时被 SIGKILL
    stop_grace_period: 45s
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # prod 必须显式分配唯一 worker，禁止多实例静默共享 0 造成 Snowflake 撞号。
      - WORKER_ID=${WORKER_ID:?WORKER_ID must be set explicitly (0..31)}
      - TZ=Asia/Shanghai
      - JAVA_TOOL_OPTIONS=${BACKEND_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError}
      - MYSQL_APP_PASSWORD=${MYSQL_APP_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ROCKETMQ_APP_SECRET_KEY=${ROCKETMQ_APP_SECRET_KEY}
      - QQ_SMTP_PASSWORD=${QQ_SMTP_PASSWORD}
      - AES_KEY=${AES_KEY}
      - QR_HMAC_KEY=${QR_HMAC_KEY}
      - ID_HASH_PEPPER=${ID_HASH_PEPPER}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_INIT_PASSWORD=${ADMIN_INIT_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # §6.1:抓取 + 告警。补偿链路(回补/补投/死信)成功时一声不响、失败时只留
  #   一行日志 —— 没有这两个服务,"补偿在正常工作"和"补偿一直在失败"从外部看
  #   完全一样。规则见 docker/prometheus/rules/reservex.yml。
  prometheus:
    image: prom/prometheus:v3.5.5
    restart: unless-stopped
    depends_on: [backend]
    # ⚠️ 无内置鉴权:Prometheus/Alertmanager 都没有登录,谁连上谁就能读全部指标、
    #    还能通过 /-/reload、静默接口改行为。所以端口只绑 127.0.0.1(同 caddy 的
    #    做法),生产必须放在带鉴权的反代之后,不可直接暴露。
    ports: ["127.0.0.1:9090:9090"]
    # data 是 internal 网,只挂它的话宿主端口发布不生效;edge 用来放行 UI 访问,
    # data 用来抓 backend / redis-exporter / rmqbroker(它们不在 edge 上)。
    networks: [edge, data]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 单机演示留 15 天足够复盘一次事故;不设则按默认 15d,显式写出来免得误会。
      - "--storage.tsdb.retention.time=15d"
    environment:
      TZ: Asia/Shanghai

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    # ⚠️ 必须能出网发 SMTP。data 是 internal: true(无出口),只挂 data 会让
    #    告警永远发不出去 —— 而且现象是静默失败。edge 提供出网路径。
    networks: [edge, data]
    ports: ["127.0.0.1:9093:9093"]
    # entrypoint 非空时 Compose 会忽略镜像的 CMD,不会重复传 --config.file。
    entrypoint: ["/bin/sh", "/init/entrypoint.sh"]
    volumes:
      - ./docker/alertmanager/entrypoint.sh:/init/entrypoint.sh:ro
      - ./docker/alertmanager/alertmanager.tmpl.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
      - alertmanager-data:/alertmanager
    environment:
      TZ: Asia/Shanghai
      SMTP_FROM: ${SMTP_FROM}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
    # 口令走 secret 挂到 /run/secrets/smtp_password(只读),不进配置文件、
    # 不进持久卷、不出现在 docker inspect 的 env 里。
    secrets: [smtp_password]

  # §7.3:noeviction 下 Redis 到顶后写命令直接返 OOM,而 ping 仍是 PONG、
  #   healthcheck 仍是绿的 —— used/max 比例是抢号全线降级唯一的前兆信号。
  redis-exporter:
    image: oliver006/redis_exporter:v1.89.0-alpine
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    expose: ["9121"]
    networks: [data]
    environment:
      TZ: Asia/Shanghai
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # §6.0 Logging:"结构化日志(JSON)+ traceId 串上下文"。
  #   告警回答"补偿在失败",这三个服务回答"哪一笔、为什么" —— 那要按 requestId
  #   把 HTTP 侧与消息侧的日志行串起来,docker compose logs 只能全文 grep。
  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped
    # ⚠️ 无鉴权(auth_enabled: false),且日志里有手机号后四位、身份证密文这类东西。
    #    所以不发布宿主端口,只在 internal 的 data 网内,查询一律经 Grafana。
    expose: ["3100"]
    networks: [data]
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    # 镜像默认 CMD 指向 /etc/loki/local-config.yaml,换成我们这份(带 compactor
    # 保留策略 —— 上游默认配置没有,chunk 永不删,盘会一直涨到写满)。
    command: ["-config.file=/etc/loki/loki.yml"]
    environment:
      TZ: Asia/Shanghai

  alloy:
    image: grafana/alloy:v1.19.0
    restart: unless-stopped
    depends_on: [loki]
    networks: [data]
    # ⚠️ 镜像默认以 root 跑(Dockerfile 建了 alloy 用户但没 USER 它,注释里写着
    #    非 root 属实验性)。这里显式降到 473(=镜像里 alloy 用户的 uid):
    #    读日志不需要 root。/var/lib/alloy 上游已 chown 给它,positions 写得进去;
    #    日志文件是 644、目录 755,以任何 uid 都读得到。
    user: "473"
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # 只读挂 backend 的日志卷。⚠️ 故意不挂 /var/run/docker.sock:
      #    那等于把宿主 root 交给这个容器(socket 上能起特权容器、挂宿主根目录),
      #    为了收集日志付这个代价不值当。代价是只覆盖 backend,可接受 ——
      #    要串 requestId 追一笔预约,需要的正是这一份。
      - backend-logs:/logs:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--storage.path=/var/lib/alloy/data"
      # 自身指标要能被抓到(prometheus 的 alloy job),否则采集链路哑了没人知道。
      - "--server.http.listen-addr=0.0.0.0:12345"
    environment:
      TZ: Asia/Shanghai

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    depends_on: [prometheus, loki]
    # 只绑 127.0.0.1(同 caddy/prometheus 的做法)。Grafana 自带登录,但默认
    # 口令是 admin/admin,直接暴露公网等于把全部指标和日志摊开。
    ports: ["127.0.0.1:3000:3000"]
    # edge 供 UI 访问,data 用来连 prometheus / loki(它们不在 edge 上)。
    networks: [edge, data]
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # ⚠️ 面板与 provisioning 做兄弟目录,刻意不放 /var/lib/grafana/dashboards ——
      #    那样会把只读 bind 嵌套进下面那个可写命名卷内部,拓扑不可读且改卷易误伤。
      #    详见 docker/grafana/provisioning/dashboards/dashboards.yml 的说明。
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      TZ: Asia/Shanghai
      # ⚠️ 缺这个变量直接拒绝启动。Grafana 自己不会因为没设口令而报错 ——
      #    它会静默回落到 admin/admin,而"监控台还是默认口令"正是最容易被忘掉的那种洞。
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set (Grafana 管理员口令,勿留 admin)}
      # 演示环境不需要注册、不需要匿名访问、也不用查版本更新。
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    # ⚠️ 用 8080 会与 backend 冲突,用 80 在 Windows 上常被 Hyper-V 的
    #    "保留端口区间"(excludedportrange)占用 → bind 时报 access permissions 错。
    #    本配置仅供本机开发;生产必须由 TLS 入口反代,不可直接暴露此明文端口。
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend-dist:/srv/frontend:ro
    networks: [edge]
    depends_on:
      backend: { condition: service_healthy }
      frontend-build: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      TZ: Asia/Shanghai

volumes:
  mysql-data:
  redis-data:
  rocketmq-store:
  frontend-dist:
  prometheus-data:
  # 告警的抑制/静默/去重状态。不持久化的话每次重启都会把已经发过的告警重发一遍。
  alertmanager-data:
  # 日志链路(§6.0)。
  #   backend-logs:backend 写、alloy 只读。滚动上限由 application-prod.yml 的
  #     logging.logback.rollingpolicy 定(50MB × 7,总量 ≤500MB),不会无限涨。
  #   loki-data:索引与 chunk,保留期 14 天(loki.yml 的 compactor + retention_period)。
  #   alloy-data:读到哪一行的 positions。不持久化的话每次重启都会重读整个文件,
  #     日志会重复入库,而"日志里同一件事出现两遍"最容易把排障带偏。
  backend-logs:
  loki-data:
  alloy-data:
  grafana-data:

secrets:
  # 从环境变量取值(compose-spec 的 secrets.environment,Compose v2.6.0+),
  # 容器内只读挂在 /run/secrets/smtp_password。复用 backend 已有的
  # QQ_SMTP_PASSWORD,不新增一份口令。
  smtp_password:
    environment: QQ_SMTP_PASSWORD

networks:
  edge:
  data:
    internal: true
